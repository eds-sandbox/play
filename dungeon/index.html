<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dungeon</title>
<style>
  :root { --bg: #0a0a0a; --text: #c8c8c8; --muted: #6a6a6a; --accent: #e8c547; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow: hidden; user-select: none; -webkit-user-select: none; }
  #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; padding: 10px 12px; gap: 6px; }
  #status { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--text); }
  #status b { color: var(--accent); font-weight: 600; }
  .hp { color: #6fd36f; }
  #view { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; max-width: 100%; max-height: 100%; }
  #log { height: 5.6em; overflow: hidden; color: #a8a8a8; white-space: pre-wrap; }
  #log div:last-child { color: #eee; }
  #pad { display: none; gap: 6px; justify-content: center; align-items: center; }
  #pad button { font: inherit; font-size: 18px; width: 52px; height: 46px; background: #161616; color: var(--text); border: 1px solid #333; border-radius: 8px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 52px); gap: 4px; }
  .muted { color: var(--muted); }
  @media (pointer: coarse), (max-width: 700px) { #pad { display: flex; } #log { height: 4.2em; font-size: 12px; } #status { font-size: 12px; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="status"></div>
  <div id="view"><canvas id="c"></canvas></div>
  <div id="log"></div>
  <div id="pad">
    <div class="grid3">
      <span></span><button data-k="up">↑</button><span></span>
      <button data-k="left">←</button><button data-k="wait">·</button><button data-k="right">→</button>
      <span></span><button data-k="down">↓</button><span></span>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px"><button data-k="descend" title="Go down stairs">&gt;</button><button data-k="restart" title="New game">↻</button></div>
  </div>
  <div class="muted" id="help">Move/attack: arrows, WASD or hjkl · wait: . · go down stairs: &gt; · new game: R. Walk over items to pick them up.</div>
</div>
<script>
"use strict";
const MW = 60, MH = 28, FOV = 8;
const MONSTERS = [
  { ch: "r", name: "rat", hp: 3, atk: 1, def: 0, xp: 1, color: "#b08a5a", min: 1 },
  { ch: "k", name: "kobold", hp: 5, atk: 2, def: 0, xp: 2, color: "#9ad06b", min: 1 },
  { ch: "g", name: "goblin", hp: 7, atk: 3, def: 1, xp: 4, color: "#5fbf5f", min: 2 },
  { ch: "o", name: "orc", hp: 11, atk: 4, def: 1, xp: 7, color: "#d0703a", min: 3 },
  { ch: "s", name: "skeleton", hp: 9, atk: 5, def: 2, xp: 8, color: "#e6e6d0", min: 4 },
  { ch: "T", name: "troll", hp: 20, atk: 6, def: 2, xp: 15, color: "#4fa070", min: 5 },
  { ch: "D", name: "dragon", hp: 35, atk: 9, def: 4, xp: 40, color: "#e04848", min: 7 },
];
const ITEMS = [
  { ch: "!", name: "healing potion", color: "#e86fd0", w: 5 },
  { ch: "$", name: "gold", color: "#e8c547", w: 6 },
  { ch: ")", name: "sharper weapon", color: "#7fc7ff", w: 2 },
  { ch: "[", name: "piece of armour", color: "#a0a0ff", w: 2 },
];
let G;
const rnd = n => Math.floor(Math.random() * n);
const key = (x, y) => y * MW + x;

// ---------- dungeon generation: rooms joined by L-shaped corridors ----------
function generate(depth) {
  const map = new Uint8Array(MW * MH); // 0 wall, 1 floor
  const rooms = [];
  for (let tries = 0; tries < 300 && rooms.length < 10; tries++) {
    const w = 5 + rnd(9), h = 4 + rnd(5), x = 1 + rnd(MW - w - 2), y = 1 + rnd(MH - h - 2);
    if (rooms.some(r => x < r.x + r.w + 1 && x + w + 1 > r.x && y < r.y + r.h + 1 && y + h + 1 > r.y)) continue;
    rooms.push({ x, y, w, h, cx: x + (w >> 1), cy: y + (h >> 1) });
    for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) map[key(xx, yy)] = 1;
  }
  rooms.sort((a, b) => a.cx - b.cx);
  const carve = (x, y) => { map[key(x, y)] = 1; };
  for (let i = 1; i < rooms.length; i++) {
    const a = rooms[i - 1], b = rooms[i];
    if (Math.random() < .5) { for (let x = Math.min(a.cx, b.cx); x <= Math.max(a.cx, b.cx); x++) carve(x, a.cy); for (let y = Math.min(a.cy, b.cy); y <= Math.max(a.cy, b.cy); y++) carve(b.cx, y); }
    else { for (let y = Math.min(a.cy, b.cy); y <= Math.max(a.cy, b.cy); y++) carve(a.cx, y); for (let x = Math.min(a.cx, b.cx); x <= Math.max(a.cx, b.cx); x++) carve(x, b.cy); }
  }
  const free = r => { for (let t = 0; t < 50; t++) { const x = r.x + rnd(r.w), y = r.y + rnd(r.h); if (!occupied(x, y)) return [x, y]; } return null; };
  const monsters = [], items = [];
  const occupied = (x, y) => monsters.some(m => m.x === x && m.y === y) || items.some(i => i.x === x && i.y === y) || (G && G.p && G.p.x === x && G.p.y === y);
  const start = rooms[0], stairs = rooms[rooms.length - 1];
  const pool = MONSTERS.filter(m => m.min <= depth);
  for (const r of rooms.slice(1)) {
    const n = rnd(2 + Math.min(3, depth >> 1)) + (Math.random() < .5 ? 1 : 0);
    for (let k = 0; k < n; k++) {
      const pos = free(r); if (!pos) continue;
      // later floors favour the tougher monsters
      const t = pool[Math.min(pool.length - 1, Math.floor(Math.pow(Math.random(), 0.8) * pool.length))];
      monsters.push({ ...t, x: pos[0], y: pos[1], maxhp: t.hp + (depth >> 1), hp: t.hp + (depth >> 1), awake: false });
    }
    if (Math.random() < .75) {
      const pos = free(r); if (pos) {
        const total = ITEMS.reduce((a, i) => a + i.w, 0); let roll = rnd(total), it = ITEMS[0];
        for (const i of ITEMS) { if ((roll -= i.w) < 0) { it = i; break; } }
        items.push({ ...it, x: pos[0], y: pos[1], amount: it.ch === "$" ? 5 + rnd(10 * depth) : 0 });
      }
    }
  }
  return { map, rooms, monsters, items, stairs: [stairs.cx, stairs.cy], start: [start.cx, start.cy], seen: new Uint8Array(MW * MH), vis: new Uint8Array(MW * MH) };
}

function newGame() {
  G = { depth: 1, p: { x: 0, y: 0, hp: 26, maxhp: 26, atk: 3, def: 0, xp: 0, lvl: 1, gold: 0 }, log: [], dead: false, turns: 0, kills: 0 };
  enterFloor(1);
  say("You climb down into the dungeon. Find the stairs (>) to go deeper.");
  draw();
}
function enterFloor(d) {
  G.depth = d; const lvl = generate(d);
  Object.assign(G, lvl); G.p.x = lvl.start[0]; G.p.y = lvl.start[1];
  computeFov(); draw();
}
function say(msg) { G.log.push(msg); if (G.log.length > 50) G.log.shift(); }

// ---------- field of view: cast rays to the edge of a circle ----------
function computeFov() {
  G.vis.fill(0);
  const { x: px, y: py } = G.p;
  for (let a = 0; a < 360; a += 1.5) {
    const dx = Math.cos(a * Math.PI / 180), dy = Math.sin(a * Math.PI / 180);
    let x = px + .5, y = py + .5;
    for (let s = 0; s <= FOV; s++) {
      const cx = Math.floor(x), cy = Math.floor(y);
      if (cx < 0 || cy < 0 || cx >= MW || cy >= MH) break;
      G.vis[key(cx, cy)] = 1; G.seen[key(cx, cy)] = 1;
      if (!G.map[key(cx, cy)]) break;
      x += dx; y += dy;
    }
  }
}

// ---------- turns ----------
const monsterAt = (x, y) => G.monsters.find(m => m.x === x && m.y === y);
function attack(a, d, aName, dName) {
  const dmg = Math.max(1, a.atk + rnd(3) - 1 - d.def);
  d.hp -= dmg;
  return dmg;
}
function act(dx, dy) {
  if (G.dead) return;
  const nx = G.p.x + dx, ny = G.p.y + dy;
  if (dx || dy) {
    const m = monsterAt(nx, ny);
    if (m) {
      const dmg = attack(G.p, m);
      if (m.hp <= 0) {
        G.monsters = G.monsters.filter(q => q !== m); G.kills++; G.p.xp += m.xp;
        say(`You defeat the ${m.name}.`);
        while (G.p.xp >= G.p.lvl * 10) { G.p.xp -= G.p.lvl * 10; G.p.lvl++; G.p.maxhp += 5; G.p.hp = G.p.maxhp; G.p.atk++; say(`You feel stronger! You are now level ${G.p.lvl}.`); }
      } else say(`You hit the ${m.name} for ${dmg}.`);
    } else if (G.map[key(nx, ny)]) {
      G.p.x = nx; G.p.y = ny;
      const it = G.items.find(i => i.x === nx && i.y === ny);
      if (it) pickUp(it);
      if (nx === G.stairs[0] && ny === G.stairs[1]) say("There are stairs down here. Press > to descend.");
    } else return; // bumping a wall costs nothing
  }
  G.turns++;
  if (G.turns % 5 === 0 && G.p.hp < G.p.maxhp) G.p.hp++;
  computeFov();
  monstersAct();
  draw();
}
function pickUp(it) {
  G.items = G.items.filter(i => i !== it);
  if (it.ch === "!") { const h = Math.min(G.p.maxhp - G.p.hp, 8 + G.depth); G.p.hp += h; say(`You drink a healing potion (+${h} HP).`); }
  else if (it.ch === "$") { G.p.gold += it.amount; say(`You pick up ${it.amount} gold.`); }
  else if (it.ch === ")") { G.p.atk++; say("You find a sharper weapon. Attack +1."); }
  else if (it.ch === "[") { G.p.def++; say("You strap on some armour. Defence +1."); }
}
function monstersAct() {
  for (const m of G.monsters) {
    const seen = G.vis[key(m.x, m.y)];
    if (seen) m.awake = true;
    if (!m.awake) continue;
    const dx = G.p.x - m.x, dy = G.p.y - m.y;
    if (Math.abs(dx) + Math.abs(dy) === 1) {
      const dmg = attack(m, G.p);
      say(`The ${m.name} hits you for ${dmg}.`);
      if (G.p.hp <= 0) return die(m);
      continue;
    }
    // step toward the player, trying the more direct axis first
    const steps = Math.abs(dx) > Math.abs(dy) ? [[Math.sign(dx), 0], [0, Math.sign(dy)]] : [[0, Math.sign(dy)], [Math.sign(dx), 0]];
    for (const [sx, sy] of steps) {
      if (!sx && !sy) continue;
      const nx = m.x + sx, ny = m.y + sy;
      if (G.map[key(nx, ny)] && !monsterAt(nx, ny) && !(nx === G.p.x && ny === G.p.y)) { m.x = nx; m.y = ny; break; }
    }
  }
}
function die(m) {
  G.dead = true;
  let best = 0; try { best = +localStorage.getItem("dungeon.bestDepth") || 0; } catch {}
  if (G.depth > best) { try { localStorage.setItem("dungeon.bestDepth", G.depth); } catch {} }
  say(`You were slain by a ${m.name} on floor ${G.depth}, with ${G.p.gold} gold and ${G.kills} kills. Press R to try again.`);
}
function descend() {
  if (G.dead) return;
  if (G.p.x !== G.stairs[0] || G.p.y !== G.stairs[1]) { say("There are no stairs here."); draw(); return; }
  enterFloor(G.depth + 1);
  say(`You descend to floor ${G.depth}. It's darker down here.`); draw();
}

// ---------- drawing ----------
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let cw = 12, ch = 20, DPR = 1, VW = MW, VH = MH, camX = 0, camY = 0;
function resize() {
  const box = document.getElementById("view").getBoundingClientRect();
  DPR = Math.min(devicePixelRatio || 1, 2);
  // keep characters readable; if the whole map doesn't fit, the view follows the player
  cw = Math.max(11, Math.floor(Math.min(box.width / MW, box.height / MH / 1.6)));
  ch = Math.round(cw * 1.6);
  VW = Math.min(MW, Math.floor(box.width / cw)); VH = Math.min(MH, Math.floor(box.height / ch));
  cv.style.width = cw * VW + "px"; cv.style.height = ch * VH + "px";
  cv.width = cw * VW * DPR; cv.height = ch * VH * DPR;
  if (G) draw();
}
addEventListener("resize", resize);
function glyph(c, x, y, color) { x -= camX; y -= camY; if (x < 0 || y < 0 || x >= VW || y >= VH) return; ctx.fillStyle = color; ctx.fillText(c, x * cw + cw / 2, y * ch + ch / 2 + 1); }
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  camX = Math.max(0, Math.min(MW - VW, G.p.x - (VW >> 1))); camY = Math.max(0, Math.min(MH - VH, G.p.y - (VH >> 1)));
  ctx.fillStyle = "#0a0a0a"; ctx.fillRect(0, 0, cw * VW, ch * VH);
  ctx.font = `${Math.round(ch * 0.85)}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const k = key(x, y); if (!G.seen[k]) continue;
    const vis = G.vis[k], floor = G.map[k];
    if (!floor) {
      // only draw walls that border a floor tile we have seen
      let edge = false; for (let yy = -1; yy <= 1 && !edge; yy++) for (let xx = -1; xx <= 1; xx++) { const q = key(x + xx, y + yy); if (x + xx >= 0 && y + yy >= 0 && x + xx < MW && y + yy < MH && G.map[q]) { edge = true; break; } }
      if (edge) glyph("#", x, y, vis ? "#8a7b66" : "#3a352e");
    } else glyph(".", x, y, vis ? "#5a5a5a" : "#262626");
  }
  const [sx, sy] = G.stairs; if (G.seen[key(sx, sy)]) glyph(">", sx, sy, G.vis[key(sx, sy)] ? "#ffffff" : "#777");
  for (const it of G.items) if (G.vis[key(it.x, it.y)]) glyph(it.ch, it.x, it.y, it.color);
  for (const m of G.monsters) if (G.vis[key(m.x, m.y)]) glyph(m.ch, m.x, m.y, m.color);
  glyph("@", G.p.x, G.p.y, G.dead ? "#e04848" : "#ffe66b");
  const p = G.p, hpColor = p.hp <= p.maxhp / 3 ? "#e04848" : p.hp <= p.maxhp * 2 / 3 ? "#e8c547" : "#6fd36f";
  document.getElementById("status").innerHTML =
    `<span>Floor <b>${G.depth}</b></span><span>HP <b style="color:${hpColor}">${Math.max(0, p.hp)}/${p.maxhp}</b></span><span>Lvl <b>${p.lvl}</b> <span class="muted">(${p.xp}/${p.lvl * 10} xp)</span></span><span>Atk <b>${p.atk}</b> Def <b>${p.def}</b></span><span>Gold <b>${p.gold}</b></span>`;
  document.getElementById("log").innerHTML = G.log.slice(-5).map(l => `<div>${l}</div>`).join("");
}

// ---------- input ----------
const MOVES = { arrowup: [0, -1], w: [0, -1], k: [0, -1], arrowdown: [0, 1], s: [0, 1], j: [0, 1], arrowleft: [-1, 0], a: [-1, 0], h: [-1, 0], arrowright: [1, 0], d: [1, 0], l: [1, 0] };
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k in MOVES) { e.preventDefault(); act(...MOVES[k]); }
  else if (k === "." || k === " ") { e.preventDefault(); act(0, 0); }
  else if (e.key === ">" || k === "enter") descend();
  else if (k === "r" && (G.dead || confirm("Start a new game?"))) newGame();
});
document.querySelectorAll("#pad button").forEach(b => b.addEventListener("click", () => {
  const k = b.dataset.k;
  if (k === "up") act(0, -1); else if (k === "down") act(0, 1); else if (k === "left") act(-1, 0); else if (k === "right") act(1, 0);
  else if (k === "wait") act(0, 0); else if (k === "descend") descend(); else if (k === "restart" && (G.dead || confirm("Start a new game?"))) newGame();
}));
newGame(); resize();
window.__game = { get G() { return G; }, act, descend, newGame, generate };
</script>
</body>
</html>
