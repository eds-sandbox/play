<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shrink Snake</title>
<style>
  :root { --text: #f3f7e8; --muted: #a3b08a; --accent: #c6f06a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #12170c; color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #top { position: fixed; top: 12px; left: 16px; right: 16px; display: flex; justify-content: space-between; pointer-events: none; gap: 10px; }
  h1 { margin: 0; font-size: 18px; }
  .muted { color: var(--muted); font-size: 13px; }
  #stats { text-align: right; font-variant-numeric: tabular-nums; }
  #stats b { color: var(--accent); font-size: 22px; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  #msg.hide { display: none; }
  #msg .card { background: rgba(20,28,12,.92); border: 1px solid #36441f; border-radius: 16px; padding: 20px 26px; text-align: center; max-width: calc(100vw - 32px); }
  #msg h2 { margin: 0 0 6px; color: var(--accent); }
  #msg p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <div><h1>Shrink Snake</h1><div class="muted">Every bite makes you shorter. Get down to length 1.</div></div>
  <div id="stats"><b id="len">0</b><div class="muted">long · level <span id="lvl">1</span></div></div>
</div>
<div id="msg"><div class="card"><h2 id="msgTitle">Shrink Snake</h2><p id="msgText">You start out very long. Each fruit shrinks you by one (gold ones by three), but your tail slowly grows back. Don't bite yourself or the walls.<br><br>Arrow keys / WASD or swipe. Press a key or tap to start.</p></div></div>
<script>
"use strict";
const COLS = 22, ROWS = 16;
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];
let G = { state: "intro", level: 1 };
let bestLevel = 1; try { bestLevel = +localStorage.getItem("shrinkSnake.level") || 1; } catch {}

function walls(level) {
  const w = new Set();
  if (level >= 2) for (let y = 4; y <= 11; y++) w.add(`${11},${y}`);
  if (level >= 3) { for (let x = 4; x <= 8; x++) w.add(`${x},3`); for (let x = 14; x <= 18; x++) w.add(`${x},12`); }
  if (level >= 4) { for (let y = 6; y <= 9; y++) { w.add(`3,${y}`); w.add(`18,${y}`); } }
  return w;
}
function serpentine(L, blocked) {
  // lay the body in rows across the top so the head starts with open space below
  const path = [];
  for (let row = 1; row < ROWS - 1 && path.length < L + 1; row++) {
    const xs = row % 2 ? [...Array(COLS - 2).keys()].map(i => i + 1) : [...Array(COLS - 2).keys()].map(i => COLS - 2 - i);
    for (const x of xs) if (!blocked.has(`${x},${row}`)) path.push([x, row]);
  }
  return path;
}
function startLevel(level) {
  const L = Math.min(60, 14 + level * 6);
  const wl = walls(level);
  const path = serpentine(L, wl);
  // keep only a path that is truly connected step by step
  const body = [path[0]];
  for (let i = 1; i < path.length && body.length < L; i++) {
    const [px, py] = body[body.length - 1], [x, y] = path[i];
    if (Math.abs(px - x) + Math.abs(py - y) === 1) body.push(path[i]); else break;
  }
  const snake = body.reverse(); // head first
  const [hx, hy] = snake[0], [nx, ny] = snake[1];
  // head initially points down, into the open area
  G = { state: "play", level, snake, dir: 1, queue: [], walls: wl, fruit: null, gold: null, tick: Math.max(70, 150 - level * 12),
        acc: 0, growT: 0, growEvery: Math.max(3.5, 7 - level * 0.6), t: 0, eaten: 0, pops: [] };
  if (snake.some(([x, y]) => x === hx && y === hy + 1) || wl.has(`${hx},${hy + 1}`)) G.dir = hx > nx ? 0 : 2;
  placeFruit(); show(false); hud();
}
const key = (x, y) => `${x},${y}`;
function freeCell() {
  const occ = new Set(G.snake.map(([x, y]) => key(x, y)));
  for (let t = 0; t < 500; t++) {
    const x = 1 + Math.floor(Math.random() * (COLS - 2)), y = 1 + Math.floor(Math.random() * (ROWS - 2));
    if (!occ.has(key(x, y)) && !G.walls.has(key(x, y)) && !(G.fruit && G.fruit[0] === x && G.fruit[1] === y)) return [x, y];
  }
  return null;
}
function placeFruit() { G.fruit = freeCell(); }
function hud() {
  document.getElementById("len").textContent = G.snake ? G.snake.length : 0;
  document.getElementById("lvl").textContent = G.level;
}
function turn(d) {
  if (G.state !== "play") { if (G.state === "won") startLevel(G.level + 1); else startLevel(G.state === "dead" ? G.level : bestLevel); return; }
  const last = G.queue.length ? G.queue[G.queue.length - 1] : G.dir;
  if (d === last || (d + 2) % 4 === last) return;
  if (G.queue.length < 2) G.queue.push(d);
}
function step() {
  if (G.queue.length) G.dir = G.queue.shift();
  const [hx, hy] = G.snake[0], [dx, dy] = DIRS[G.dir], nx = hx + dx, ny = hy + dy;
  const growing = G.pendingGrow > 0;
  const body = growing ? G.snake : G.snake.slice(0, -1);
  if (nx <= 0 || ny <= 0 || nx >= COLS - 1 || ny >= ROWS - 1 || G.walls.has(key(nx, ny)) || body.some(([x, y]) => x === nx && y === ny)) return die();
  G.snake.unshift([nx, ny]);
  if (growing) G.pendingGrow--; else G.snake.pop();
  let shrink = 0;
  if (G.fruit && nx === G.fruit[0] && ny === G.fruit[1]) { shrink = 1; G.pops.push({ x: nx, y: ny, t: 0 }); placeFruit(); if (Math.random() < 0.25 && !G.gold) G.gold = { at: freeCell(), life: 6 }; }
  if (G.gold && G.gold.at && nx === G.gold.at[0] && ny === G.gold.at[1]) { shrink = 3; G.pops.push({ x: nx, y: ny, t: 0, gold: true }); G.gold = null; }
  if (shrink) {
    G.eaten++;
    G.snake.length = Math.max(1, G.snake.length - shrink);
    G.growT = 0;
    if (G.snake.length === 1) return win();
  }
  hud();
}
function update(dt) {
  for (const p of G.pops || []) p.t += dt;
  if (G.pops) G.pops = G.pops.filter(p => p.t < 0.5);
  if (G.state !== "play") return;
  G.t += dt; G.growT += dt;
  if (G.growT >= G.growEvery) { G.growT = 0; G.pendingGrow = (G.pendingGrow || 0) + 1; }
  if (G.gold) { G.gold.life -= dt; if (G.gold.life <= 0) G.gold = null; }
  G.acc += dt * 1000;
  while (G.acc >= G.tick && G.state === "play") { G.acc -= G.tick; step(); }
}
function die() {
  G.state = "dead";
  document.getElementById("msgTitle").textContent = "Ouch!";
  document.getElementById("msgText").textContent = `You were still ${G.snake.length} long. Press a key or tap to retry level ${G.level}.`;
  show(true);
}
function win() {
  G.state = "won";
  if (G.level + 1 > bestLevel) { bestLevel = G.level + 1; try { localStorage.setItem("shrinkSnake.level", bestLevel); } catch {} }
  document.getElementById("msgTitle").textContent = `Level ${G.level} done!`;
  document.getElementById("msgText").textContent = `Down to a single segment in ${G.t.toFixed(0)}s. Next level you start longer, move faster and grow back sooner. Press a key or tap.`;
  show(true); hud();
}
function show(v) { document.getElementById("msg").classList.toggle("hide", !v); }

// ---------- rendering ----------
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let DPR = 1;
function resize() { DPR = Math.min(devicePixelRatio || 1, 2); cv.width = innerWidth * DPR; cv.height = innerHeight * DPR; }
addEventListener("resize", resize);
function render(now) {
  const top = 66, cs = Math.floor(Math.min((innerWidth - 16) / COLS, (innerHeight - top - 30) / ROWS));
  const ox = Math.floor((innerWidth - cs * COLS) / 2), oy = Math.floor(top + (innerHeight - top - 30 - cs * ROWS) / 2);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = "#12170c"; ctx.fillRect(0, 0, innerWidth, innerHeight);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const edge = x === 0 || y === 0 || x === COLS - 1 || y === ROWS - 1, wall = edge || (G.walls && G.walls.has(key(x, y)));
    ctx.fillStyle = wall ? "#3d4a28" : (x + y) % 2 ? "#1b2312" : "#1e2715";
    ctx.fillRect(ox + x * cs, oy + y * cs, cs, cs);
  }
  if (G.state === "intro") return;
  // growth timer bar
  ctx.fillStyle = "#2c3a1a"; ctx.fillRect(ox, oy + ROWS * cs + 8, cs * COLS, 5);
  ctx.fillStyle = "#e0874a"; ctx.fillRect(ox, oy + ROWS * cs + 8, cs * COLS * Math.min(1, G.growT / G.growEvery), 5);
  if (G.fruit) { const [fx, fy] = G.fruit; ctx.fillStyle = "#ff5d5d"; ctx.beginPath(); ctx.arc(ox + (fx + .5) * cs, oy + (fy + .55) * cs, cs * .36, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = "#6ad04a"; ctx.fillRect(ox + (fx + .48) * cs, oy + (fy + .1) * cs, cs * .12, cs * .22); }
  if (G.gold && G.gold.at) { const [gx, gy] = G.gold.at, blink = G.gold.life < 2 && Math.floor(now / 120) % 2; if (!blink) { ctx.fillStyle = "#ffd447"; ctx.beginPath(); ctx.arc(ox + (gx + .5) * cs, oy + (gy + .5) * cs, cs * .4, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = "#7a5a00"; ctx.font = `700 ${cs * .45}px system-ui`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("3", ox + (gx + .5) * cs, oy + (gy + .55) * cs); } }
  const n = G.snake.length;
  G.snake.forEach(([x, y], i) => {
    const k = i / Math.max(1, n - 1);
    ctx.fillStyle = i === 0 ? (G.state === "dead" ? "#ff6b6b" : "#e6ff9a") : `hsl(${85 - k * 30} 60% ${55 - k * 18}%)`;
    const pad = i === 0 ? cs * .05 : cs * .12;
    ctx.beginPath(); ctx.roundRect(ox + x * cs + pad, oy + y * cs + pad, cs - pad * 2, cs - pad * 2, cs * .3); ctx.fill();
  });
  const [hx, hy] = G.snake[0], [dx, dy] = DIRS[G.dir];
  ctx.fillStyle = "#12170c";
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(ox + (hx + .5 + dx * .18 - dy * .2 * s) * cs, oy + (hy + .5 + dy * .18 + dx * .2 * s) * cs, cs * .08, 0, Math.PI * 2); ctx.fill(); }
  for (const p of G.pops) { ctx.strokeStyle = p.gold ? `rgba(255,212,71,${1 - p.t * 2})` : `rgba(255,93,93,${1 - p.t * 2})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ox + (p.x + .5) * cs, oy + (p.y + .5) * cs, cs * (.4 + p.t * 2), 0, Math.PI * 2); ctx.stroke(); }
}

// ---------- input & loop ----------
const KEYMAP = { arrowright: 0, d: 0, arrowdown: 1, s: 1, arrowleft: 2, a: 2, arrowup: 3, w: 3 };
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k in KEYMAP) { e.preventDefault(); turn(KEYMAP[k]); }
  else if (G.state !== "play" && (k === " " || k === "enter")) { e.preventDefault(); turn(G.dir ?? 1); }
});
let sw = null;
cv.addEventListener("pointerdown", e => { sw = [e.clientX, e.clientY]; if (G.state !== "play") turn(G.dir ?? 1); });
cv.addEventListener("pointermove", e => {
  if (!sw || G.state !== "play") return;
  const dx = e.clientX - sw[0], dy = e.clientY - sw[1];
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
  turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 0 : 2) : (dy > 0 ? 1 : 3)); sw = [e.clientX, e.clientY];
});
cv.addEventListener("pointerup", () => { sw = null; });
let last = performance.now();
function frame(now) { update(Math.min(0.1, (now - last) / 1000)); last = now; render(now); requestAnimationFrame(frame); }
resize();
window.__game = { get G() { return G; }, startLevel, turn, step, update, COLS, ROWS, DIRS };
requestAnimationFrame(frame);
</script>
</body>
</html>
