<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ice Slide</title>
<style>
  :root { --text: #12324a; --muted: #5b7d95; --accent: #1f8fd6; --panel: rgba(255,255,255,.85); --border: #c8e1f2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: linear-gradient(#e8f6ff, #cfeafc); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #top { position: fixed; top: 12px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }
  #top > * { pointer-events: auto; }
  h1 { margin: 0; font-size: 18px; }
  .muted { color: var(--muted); font-size: 13px; }
  .nav { display: flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
  .nav b { min-width: 70px; text-align: center; }
  #moves { text-align: right; }
  #bar { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
  button { font: inherit; font-size: 14px; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; cursor: pointer; min-height: 38px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  #win { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(220,240,255,.4); }
  #win.show { display: flex; }
  #win .card { background: #fff; border-radius: 16px; padding: 22px 28px; text-align: center; box-shadow: 0 10px 40px rgba(20,80,130,.15); }
  #win h2 { margin: 0 0 4px; color: var(--accent); }
  .stars { font-size: 26px; color: #f5b82e; letter-spacing: 4px; }
  #win p { color: var(--muted); margin: 6px 0 14px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <div><h1>Ice Slide</h1><div class="muted">You slide until you hit a rock. Stop on the flag.</div></div>
  <div>
    <div class="nav"><button id="prev">‹</button><b id="lvl">Level 1</b><button id="next">›</button></div>
    <div class="muted" id="moves">0 moves · best 0</div>
  </div>
</div>
<div id="bar">
  <button id="undo">Undo</button>
  <button id="restart">Restart</button>
</div>
<div id="win"><div class="card"><h2>Made it!</h2><div class="stars" id="stars"></div><p id="winText"></p><button class="primary" id="nextBtn">Next level →</button></div></div>
<script>
"use strict";
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

function slide(L, x, y, d) {
  const [dx, dy] = DIRS[d];
  while (true) {
    const nx = x + dx, ny = y + dy;
    if (nx < 0 || ny < 0 || nx >= L.w || ny >= L.h || L.rock[ny * L.w + nx]) return [x, y];
    x = nx; y = ny;
  }
}
// Breadth-first search over stopping squares: shortest distance and number of shortest routes.
function solve(L, sx, sy) {
  const N = L.w * L.h, dist = new Int16Array(N).fill(-1), ways = new Float64Array(N), prev = new Int32Array(N).fill(-1);
  const s = sy * L.w + sx; dist[s] = 0; ways[s] = 1;
  const q = [s];
  for (let qi = 0; qi < q.length; qi++) {
    const c = q[qi], x = c % L.w, y = (c / L.w) | 0;
    for (let d = 0; d < 4; d++) {
      const [nx, ny] = slide(L, x, y, d), n = ny * L.w + nx;
      if (n === c) continue;
      if (dist[n] < 0) { dist[n] = dist[c] + 1; ways[n] = ways[c]; prev[n] = c; q.push(n); }
      else if (dist[n] === dist[c] + 1) ways[n] += ways[c];
    }
  }
  return { dist, ways, prev };
}
function params(n) {
  return { w: Math.min(13, 7 + Math.floor(n / 3)), h: Math.min(11, 7 + Math.floor(n / 4)), rocks: 0.12 + Math.min(0.08, n * 0.004), minMoves: Math.min(13, 3 + Math.floor(n * 0.6)) };
}
function generate(n) {
  const rng = mulberry32(Math.imul(n + 7, 2246822519)), P = params(n);
  for (let attempt = 0; attempt < 5000; attempt++) {
    const L = { w: P.w, h: P.h, rock: new Uint8Array(P.w * P.h) };
    for (let i = 0; i < L.rock.length; i++) if (rng() < P.rocks) L.rock[i] = 1;
    const free = []; for (let i = 0; i < L.rock.length; i++) if (!L.rock[i]) free.push(i);
    const s = free[Math.floor(rng() * free.length)];
    const sol = solve(L, s % L.w, (s / L.w) | 0);
    let best = -1;
    for (let i = 0; i < L.rock.length; i++) {
      if (sol.dist[i] >= P.minMoves && sol.dist[i] <= P.minMoves + 2 && sol.ways[i] === 1 && (best < 0 || sol.dist[i] > sol.dist[best])) best = i;
    }
    if (best < 0) continue;
    L.start = [s % L.w, (s / L.w) | 0]; L.goal = [best % L.w, (best / L.w) | 0]; L.par = sol.dist[best]; L.number = n;
    return L;
  }
  throw new Error("no level");
}

const KEY = "iceSlide.progress";
let progress = {}; try { progress = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
const unlocked = () => Math.max(1, ...Object.keys(progress).map(k => +k + 1));
const G = { L: null, pos: [0, 0], anim: null, moves: 0, history: [], won: false, trail: [] };

function load(n) {
  G.L = generate(n); G.pos = [...G.L.start]; G.anim = null; G.moves = 0; G.history = []; G.won = false; G.trail = [];
  document.getElementById("win").classList.remove("show"); ui();
}
function ui() {
  const n = G.L.number;
  document.getElementById("lvl").textContent = `Level ${n}`;
  document.getElementById("moves").textContent = `${G.moves} move${G.moves === 1 ? "" : "s"} · best possible ${G.L.par}`;
  document.getElementById("prev").disabled = n <= 1;
  document.getElementById("next").disabled = n >= unlocked();
  document.getElementById("undo").disabled = !G.history.length || G.won;
}
function move(d) {
  if (G.anim || G.won) return;
  const [x, y] = G.pos, [nx, ny] = slide(G.L, x, y, d);
  if (nx === x && ny === y) { G.bump = { d, t: performance.now() }; return; }
  G.history.push([x, y]); G.moves++;
  G.anim = { from: [x, y], to: [nx, ny], t0: performance.now(), ms: 70 + 45 * Math.hypot(nx - x, ny - y) };
  ui();
}
function arrive() {
  G.pos = G.anim.to; G.trail.push([G.anim.from, G.anim.to]); G.anim = null;
  if (G.pos[0] === G.L.goal[0] && G.pos[1] === G.L.goal[1]) {
    G.won = true;
    const n = G.L.number, stars = G.moves <= G.L.par ? 3 : G.moves <= G.L.par + 2 ? 2 : 1;
    progress[n] = Math.max(progress[n] || 0, stars); try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch {}
    document.getElementById("stars").textContent = "★".repeat(stars) + "☆".repeat(3 - stars);
    document.getElementById("winText").textContent = G.moves <= G.L.par ? `${G.moves} moves: the shortest route!` : `${G.moves} moves. It can be done in ${G.L.par}.`;
    setTimeout(() => document.getElementById("win").classList.add("show"), 250);
    ui();
  }
}
function undo() { if (G.anim || G.won || !G.history.length) return; G.pos = G.history.pop(); G.trail.pop(); G.moves--; ui(); }

// ---------- rendering ----------
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let DPR = 1;
function resize() { DPR = Math.min(devicePixelRatio || 1, 2); cv.width = innerWidth * DPR; cv.height = innerHeight * DPR; }
addEventListener("resize", resize);
function render(now) {
  const L = G.L, top = innerWidth < 560 ? 96 : 80, bottom = 70;
  const cs = Math.floor(Math.min((innerWidth - 24) / L.w, (innerHeight - top - bottom) / L.h, 64));
  const ox = (innerWidth - cs * L.w) / 2, oy = top + (innerHeight - top - bottom - cs * L.h) / 2;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, innerWidth, innerHeight);
  // ice
  ctx.fillStyle = "#f4fbff"; ctx.strokeStyle = "#7fb8dc"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.roundRect(ox - 4, oy - 4, cs * L.w + 8, cs * L.h + 8, 10); ctx.fill(); ctx.stroke();
  for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) {
    const px = ox + x * cs, py = oy + y * cs;
    ctx.fillStyle = (x + y) % 2 ? "#eaf6fe" : "#f4fbff"; ctx.fillRect(px, py, cs, cs);
    if (L.rock[y * L.w + x]) {
      ctx.fillStyle = "#6f7f8c"; ctx.beginPath(); ctx.roundRect(px + cs * .1, py + cs * .12, cs * .8, cs * .78, cs * .25); ctx.fill();
      ctx.fillStyle = "#8d9eab"; ctx.beginPath(); ctx.roundRect(px + cs * .18, py + cs * .14, cs * .5, cs * .35, cs * .2); ctx.fill();
    }
  }
  // trail of slides
  ctx.strokeStyle = "rgba(31,143,214,.18)"; ctx.lineWidth = cs * .18; ctx.lineCap = "round";
  for (const [[ax, ay], [bx, by]] of G.trail) { ctx.beginPath(); ctx.moveTo(ox + (ax + .5) * cs, oy + (ay + .5) * cs); ctx.lineTo(ox + (bx + .5) * cs, oy + (by + .5) * cs); ctx.stroke(); }
  // goal flag
  const [gx, gy] = L.goal, fx = ox + (gx + .5) * cs, fy = oy + (gy + .5) * cs;
  ctx.fillStyle = "rgba(31,143,214,.15)"; ctx.beginPath(); ctx.arc(fx, fy, cs * .38, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#12324a"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(fx - cs * .12, fy + cs * .3); ctx.lineTo(fx - cs * .12, fy - cs * .32); ctx.stroke();
  ctx.fillStyle = "#e8453c"; ctx.beginPath(); ctx.moveTo(fx - cs * .12, fy - cs * .32); ctx.lineTo(fx + cs * .25, fy - cs * .2); ctx.lineTo(fx - cs * .12, fy - cs * .06); ctx.fill();
  // player
  let [px, py] = G.pos;
  if (G.anim) {
    const k = Math.min(1, (now - G.anim.t0) / G.anim.ms), e = 1 - (1 - k) * (1 - k);
    px = G.anim.from[0] + (G.anim.to[0] - G.anim.from[0]) * e; py = G.anim.from[1] + (G.anim.to[1] - G.anim.from[1]) * e;
    if (k >= 1) arrive();
  }
  let bx = 0, by = 0;
  if (G.bump && now - G.bump.t < 150) { const k = Math.sin((now - G.bump.t) / 150 * Math.PI) * cs * .08; bx = DIRS[G.bump.d][0] * k; by = DIRS[G.bump.d][1] * k; }
  const cx = ox + (px + .5) * cs + bx, cy = oy + (py + .5) * cs + by, r = cs * .34;
  ctx.fillStyle = "rgba(20,60,90,.15)"; ctx.beginPath(); ctx.ellipse(cx, cy + r * .9, r * .8, r * .25, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#1d2b38"; ctx.beginPath(); ctx.ellipse(cx, cy, r * .85, r, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(cx, cy + r * .2, r * .55, r * .7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#1d2b38"; ctx.beginPath(); ctx.arc(cx - r * .25, cy - r * .35, r * .1, 0, Math.PI * 2); ctx.arc(cx + r * .25, cy - r * .35, r * .1, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#f5a623"; ctx.beginPath(); ctx.moveTo(cx - r * .14, cy - r * .18); ctx.lineTo(cx + r * .14, cy - r * .18); ctx.lineTo(cx, cy); ctx.fill();
}

// ---------- input ----------
const KEYS = { arrowright: 0, d: 0, arrowdown: 1, s: 1, arrowleft: 2, a: 2, arrowup: 3, w: 3 };
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k in KEYS) { e.preventDefault(); move(KEYS[k]); }
  else if (k === "z" || k === "backspace") undo();
  else if (k === "r") load(G.L.number);
  else if ((k === "enter" || k === " ") && G.won) load(G.L.number + 1);
});
let touch = null;
cv.addEventListener("pointerdown", e => { touch = [e.clientX, e.clientY]; });
cv.addEventListener("pointerup", e => {
  if (!touch) return;
  const dx = e.clientX - touch[0], dy = e.clientY - touch[1]; touch = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 0 : 2) : (dy > 0 ? 1 : 3));
});
document.getElementById("undo").onclick = undo;
document.getElementById("restart").onclick = () => load(G.L.number);
document.getElementById("prev").onclick = () => load(G.L.number - 1);
document.getElementById("next").onclick = () => load(G.L.number + 1);
document.getElementById("nextBtn").onclick = () => load(G.L.number + 1);

function frame(now) { render(now); requestAnimationFrame(frame); }
resize(); load(unlocked());
window.__game = { G, generate, solve, slide, move, load };
requestAnimationFrame(frame);
</script>
</body>
</html>
