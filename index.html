<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play</title>
<style>
  :root { --bg: #0f0d14; --card: #1b1724; --text: #f1ebe0; --muted: #a49cb0; --accent: #ffcf70; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; padding: 32px 16px; }
  main { width: 100%; max-width: 560px; display: grid; gap: 12px; }
  main > h1, main > p.lead { margin-bottom: 0; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  p.lead { margin: 0 0 24px; color: var(--muted); }
  a.card { display: block; background: var(--card); border: 1px solid #3a3346; border-radius: 14px; padding: 18px 20px;
    color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
  a.card:hover { border-color: var(--accent); transform: translateY(-2px); }
  a.card h2 { margin: 0 0 4px; font-size: 19px; color: var(--accent); }
  a.card p { margin: 0; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Play</h1>
  <p class="lead">Small browser games and experiments.</p>
  <a class="card" href="shadow-match/">
    <h2>Shadow Match →</h2>
    <p>Turn a 3D shape until the shadow it casts on the wall matches the target outline.</p>
  </a>
  <a class="card" href="tiny-ant-colony/">
    <h2>Tiny Ant Colony →</h2>
    <p>Ants find food by following each other's scent trails. Place food and walls and watch the paths form.</p>
  </a>
</main>
</body>
</html>
